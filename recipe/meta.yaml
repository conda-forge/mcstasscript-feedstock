{% set version = "0.0.93" %}

package:
  name: mcstasscript
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/m/mcstasscript/mcstasscript-{{ version }}.tar.gz
  sha256: 9e910b65ddaed9780ebd1d08335b39f235bb8df11dd0f115576880eee4ee61e7

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy
    - matplotlib-base
    - pyyaml
    - ipywidgets
    - libpyvinyl
    - ipympl
    - h5py

test:
  imports:
    - mcstasscript
  commands:
    - pip check
    - python -c "import mcstasscript; print(mcstasscript.__file__)"
    - pytest -v mcstasscript/tests
    - python -c "import pythreejs"
    - pytest -v mcstasscript/optional_tests
  source_files:
    - mcstasscript
  requires:
    - pytest
    - pip
    - python {{ python_min }}
    - pythreejs

about:
  home: https://panosc-vinyl.github.io/McStasScript
  summary: McStas API for creating and running McStas instruments from python scripting
  description: |
    McStasScript is a Python API for McStas, which allows the user to get help,
    build their instrument, perform simulations and plot the resulting
    data. This site serves as the documentation for the package and contains
    conceptual explanations of how the package is meant to be used, tutorials
    and a reference for all internal functions/methods.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  doc_url: https://panosc-vinyl.github.io/McStasScript
  dev_url: https://github.com/PaNOSC-ViNYL/McStasScript

extra:
  recipe-maintainers:
    - mads-bertelsen
    - willend
    - tkittel
